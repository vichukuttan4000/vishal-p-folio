###############################################################################
# Netlify configuration — TanStack Start (SSR) on Netlify Functions (Node)
#
# This project uses TanStack Start. The default Lovable Vite wrapper builds
# for the Cloudflare Workers runtime, so for Netlify we disable the
# Cloudflare adapter at build time and serve the SSR entry from a standard
# Netlify Function running on the Node runtime (full React 19 / jsx-runtime
# compatibility — Edge Functions / Deno don't support those subpath exports).
#
# Required setup in Netlify dashboard:
#   1. Connect this GitHub repo to a new Netlify site.
#   2. Add the environment variable:
#        VITE_CONTACT_FORM_URL = https://script.google.com/macros/s/.../exec
#   3. Trigger a deploy. Netlify will use the build/publish settings below.
###############################################################################

[build]
  command = "npm run build"
  publish = "dist/client"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Tells vite.config.ts to skip the Cloudflare Workers adapter for this build.
  BUILD_TARGET = "netlify"

[functions]
  # Bundle the SSR function with esbuild and include the built server bundle
  # so the relative `../../dist/server/server.js` import resolves at runtime.
  node_bundler = "esbuild"
  included_files = ["dist/server/**"]

# Static assets emitted by Vite are served directly from /dist/client.
# Anything else falls through to the SSR Node function below.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/ssr"
  status = 200
  force = false

# Long-cache hashed Vite assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
